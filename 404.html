<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rifat Shahriya</title>
<meta name="description" content="Official website of Rifat Shahriya — software developer, music artist and digital creator from Gopalganj, Bangladesh.">
<meta name="theme-color" content="#F4F3EF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%23111%27/%3E%3Ctext x=%2732%27 y=%2745%27 font-size=%2734%27 font-weight=%27800%27 text-anchor=%27middle%27 fill=%27%23fff%27 font-family=%27Arial%27%3ER%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com"><link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<style>
:root{--cols:6;--lw:1px;--bg:#F4F3EF;--ink:#111;--mut:#777;--line:#dcdbd6;--soft:#ebeae5;--pad:clamp(20px,4vw,64px);--ease:cubic-bezier(.2,.7,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{font-family:var(--font,Inter),Inter,Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 var(--pad);pointer-events:none;z-index:0;border-left:var(--lw) solid var(--lcol,var(--line));border-right:var(--lw) solid var(--lcol,var(--line));background:repeating-linear-gradient(90deg,transparent 0 calc(100%/var(--cols) - var(--lw)),var(--lcol,var(--line)) calc(100%/var(--cols) - var(--lw)) calc(100%/var(--cols)))}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
::selection{background:var(--ink);color:#fff}
.wrap{max-width:1440px;margin:0 auto;padding:0 var(--pad);position:relative;z-index:1}
/* nav */
.nav{position:fixed;top:0;left:0;right:0;z-index:50;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.nav .wrap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:72px}
.logo{font-weight:700;letter-spacing:-.035em;font-size:17px;justify-self:start}
.nl{display:flex;font-size:14px;font-weight:500;justify-self:center}
.nl a{transition:opacity .2s}.nl a:hover{opacity:.5}
.nl a+a::before{content:"/";margin:0 16px;color:#999;font-weight:400}
.nr{display:flex;align-items:center;gap:10px;justify-self:end}
.cbtn{display:inline-flex;align-items:center;gap:8px;background:var(--ink);color:#fff;border-radius:10px;padding:12px 20px;font-size:14px;font-weight:500;transition:.25s}
.cbtn:hover{background:#333}
.menu{background:none;border:1px solid var(--ink);border-radius:10px;cursor:pointer;width:44px;height:44px;display:flex;align-items:center;justify-content:center;transition:.25s}
.menu:hover{background:var(--ink);color:#fff}
.menu i{display:block;width:18px;height:1.6px;background:currentColor;box-shadow:0 6px 0 currentColor;margin-bottom:6px}
.ov{position:fixed;inset:0;z-index:40;background:var(--bg);padding:96px var(--pad) 40px;opacity:0;visibility:hidden;transition:.4s var(--ease);overflow:auto;display:flex;flex-direction:column;justify-content:center}
.ov.on{opacity:1;visibility:visible}
.ov .ovi{max-width:1440px;margin:0 auto;width:100%}
.ov a.m{display:flex;align-items:baseline;gap:18px;font-size:clamp(26px,5vw,56px);font-weight:700;letter-spacing:-.045em;line-height:1.2;border-bottom:1px solid var(--line);padding:6px 0;transition:.25s var(--ease)}
.ov a.m:hover{padding-left:14px}
.ov small{font-size:12px;color:var(--mut);font-weight:400;letter-spacing:0;min-width:34px}
.ov .lg{display:inline-block;margin-top:28px;font-size:13px;color:var(--mut);border-bottom:1px solid var(--mut)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;border:1px solid var(--ink);padding:15px 30px;font-size:14px;font-weight:500;cursor:pointer;transition:.3s var(--ease);border-radius:10px}
.btn:hover{background:transparent;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--ink)}.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.sm2{padding:10px 20px;font-size:13px}
.dk .btn{background:#fff;color:var(--ink);border-color:#fff}.dk .btn:hover{background:transparent;color:#fff}
/* hero */
.hero{min-height:100svh;padding:96px 0 32px;display:flex;position:relative}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:clamp(24px,5vw,96px);width:100%;align-items:stretch}
.hero.noimg .wrap{grid-template-columns:1fr}
.hl{display:flex;flex-direction:column;min-height:calc(100svh - 130px)}
.hl .mid{margin:auto 0}
h1{font-size:clamp(2.2rem,8vw,7.2rem);font-weight:800;letter-spacing:-.06em;line-height:1;white-space:nowrap;margin-left:-.03em}
.hero.noimg h1{font-size:clamp(2.2rem,11vw,11rem)}
.tag{font-size:clamp(17px,1.9vw,26px);font-weight:500;letter-spacing:-.025em;margin:clamp(16px,2.2vw,30px) 0 clamp(24px,3.4vw,52px)}
.lead{border-left:2px solid var(--ink);padding-left:22px;max-width:500px;font-size:clamp(15px,1.35vw,18.5px);color:#222;line-height:1.6}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}
.hp{align-self:center;position:relative}
.ix{display:block;font-size:clamp(18px,1.8vw,24px);font-weight:600;letter-spacing:-.03em;margin-bottom:10px}
.sd{display:inline-flex;align-items:center;gap:14px;margin-top:auto;padding-top:36px;font-size:15px;font-weight:500;align-self:flex-start}
.sd .ar{font-size:28px;font-weight:300;line-height:1;animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(6px)}}
/* images */
figure.im,figure.ph{position:relative;overflow:hidden;background:#e7e6e1;width:100%}
figure.im img{position:absolute;object-fit:cover;max-width:none}
figure.ph{display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#eceae5 0 12px,#e4e3de 12px 24px);border:1px solid var(--line)}
figure.ph span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut);background:var(--bg);padding:6px 12px;text-align:center}
/* sections */
section.s{border-top:1px solid var(--line);padding:clamp(64px,10vw,140px) 0;position:relative;z-index:1}
.sg{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,9fr);gap:clamp(20px,4vw,64px)}
.sl{position:sticky;top:96px;align-self:start;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.sl b{display:block;color:var(--ink);font-size:clamp(18px,1.7vw,24px);letter-spacing:-.03em;margin-bottom:4px}
h2{font-size:clamp(2.2rem,5.6vw,5rem);font-weight:800;letter-spacing:-.055em;line-height:.96;margin-bottom:clamp(28px,4vw,56px);max-width:15ch}
.two.one{grid-template-columns:minmax(0,1fr);max-width:760px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,72px);align-items:start}
.txt p{font-size:clamp(16px,1.35vw,19px);margin-bottom:1.2em;color:#3a3a3a}
.big{font-size:clamp(1.3rem,2.4vw,2.1rem);font-weight:600;letter-spacing:-.04em;line-height:1.15;margin-bottom:22px;color:var(--ink)}
.list>*{border-top:1px solid var(--line);padding:24px 0;display:grid;grid-template-columns:48px 1fr 1.2fr 28px;gap:18px;align-items:baseline;transition:.3s var(--ease)}
.list>*:last-child{border-bottom:1px solid var(--line)}
.list .i{font-size:12px;color:var(--mut)}
.list h3{font-size:clamp(1.15rem,2vw,1.7rem);letter-spacing:-.04em;font-weight:600}
.list p{color:var(--mut);font-size:15px}
a.row:hover{background:var(--soft);padding-left:14px;padding-right:14px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:clamp(24px,3vw,44px) clamp(16px,2vw,32px)}
.card{display:block}
.card .im,.card .ph{transition:.5s var(--ease)}
.card:hover figure{transform:scale(1.015)}
.card .ct{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:18px}
.card h3{font-size:1.35rem;letter-spacing:-.04em;font-weight:600}
.card .t{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);white-space:nowrap}
.card p{color:var(--mut);font-size:14.5px;margin-top:6px;max-width:48ch}
.card .l{display:inline-block;margin-top:12px;border-bottom:1px solid var(--ink);font-size:13.5px;font-weight:500}
.dk{background:var(--ink);color:#fff;border-top:0}
.dk .sl,.dk .sl b{color:#aaa}.dk .sl b{color:#fff}
.dk .txt p,.dk .big{color:#fff}.dk .txt p{color:#ccc}
.dk figure.ph{background:repeating-linear-gradient(135deg,#1d1d1d 0 12px,#232323 12px 24px);border-color:#333}
.dk figure.ph span{background:#111;color:#aaa}
.gal{display:grid;grid-template-columns:repeat(6,1fr);gap:clamp(10px,1.4vw,20px);grid-auto-flow:dense;align-items:start}
.gal .w{grid-column:span 3}.gal .t{grid-column:span 2}.gal .q{grid-column:span 2}
.gal figure{transition:.5s var(--ease)}.gal div:hover figure{transform:scale(1.02)}
.gal small{display:block;font-size:12px;color:var(--mut);margin-top:8px}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tags span{border:1px solid var(--ink);padding:12px 24px;border-radius:99px;font-size:15px;font-weight:500;transition:.3s var(--ease)}
.tags span:hover{background:var(--ink);color:#fff;transform:translateY(-2px)}
.soc{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.soc a{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 24px;display:flex;flex-direction:column;gap:30px;transition:.3s var(--ease)}
.soc a:hover{background:var(--ink);color:#fff}.soc a:hover small{color:#aaa}
.soc b{font-size:1.25rem;letter-spacing:-.03em;font-weight:600;display:flex;justify-content:space-between}
.soc small{color:var(--mut);font-size:12.5px}
.mail{display:block;font-size:clamp(1.4rem,4.2vw,3.6rem);font-weight:700;letter-spacing:-.05em;line-height:1.05;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:28px;word-break:break-word;transition:.3s}
.mail:hover{opacity:.6}
form.c{display:grid;gap:6px}
.lab{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);margin:14px 0 4px}
.f{width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 0;border-radius:0;outline:0;transition:.2s}
.f:focus{border-bottom-color:var(--ink)}
textarea.f{min-height:110px;resize:vertical}
form.c .btn{margin-top:18px;justify-self:start}
footer{background:var(--ink);color:#fff;padding:clamp(40px,6vw,80px) 0 28px;position:relative;z-index:1;overflow:hidden}
footer .big2{font-size:clamp(3rem,13vw,12rem);font-weight:800;letter-spacing:-.065em;line-height:.85;margin-bottom:34px}
footer .fr{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:13px;color:#999;border-top:1px solid #2c2c2c;padding-top:20px}
footer a:hover{color:#fff}
.rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease)}
.rv.vis{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
@media(max-width:1000px){.nl{display:none}.nav .wrap{grid-template-columns:1fr auto}.sg{grid-template-columns:1fr}.sl{position:static}h2{max-width:none}}
@media(max-width:820px){
 .two{grid-template-columns:1fr}.hero .wrap{grid-template-columns:1fr}.hl{min-height:0}.hl .mid{margin:20px 0 0}.hp{max-width:460px;margin-top:36px}.sd{padding-top:30px}h1{font-size:clamp(2.1rem,13.6vw,6.5rem)}
 .soc{grid-template-columns:1fr 1fr}
 .list>*{grid-template-columns:36px 1fr;gap:6px 14px}.list>* p{grid-column:2}.list>* span:last-child{display:none}
 :root{--cols:3}
}
@media(max-width:560px){
 .cards{grid-template-columns:1fr}.soc{grid-template-columns:1fr}
 .gal{grid-template-columns:1fr 1fr}.gal .w,.gal .t,.gal .q{grid-column:span 1}.gal .w{grid-column:span 2}
 .cbtn{padding:11px 14px}
 .btn{flex:1;justify-content:center}.hk span:last-child{display:none}
}
.ld{min-height:100svh;display:grid;place-items:center;color:#777;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.note{background:#fff7e0;border:1px solid #ecd48a;color:#6b5200;font-size:13px;padding:10px 12px;margin-bottom:14px;line-height:1.5}
/* gallery slider + lightbox */
.gs{position:relative}
.trk{display:flex;gap:clamp(18px,2.4vw,30px);overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:10px 4px 26px;margin:-10px -4px 0}
.trk::-webkit-scrollbar{display:none}
.trk.drag{scroll-snap-type:none;cursor:grabbing;user-select:none}
.sli{flex:0 0 auto;height:clamp(250px,36vw,480px);scroll-snap-align:start;background:var(--bg);border:1px solid var(--line);border-radius:22px;padding:9px;cursor:zoom-in;text-align:left;position:relative;display:block;color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 30px -12px rgba(0,0,0,.18);transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.sli:hover{transform:translateY(-5px);box-shadow:0 2px 4px rgba(0,0,0,.05),0 22px 40px -14px rgba(0,0,0,.28)}
.sli figure{height:100%;width:auto;border-radius:14px}
.sli small{position:absolute;left:9px;right:9px;bottom:9px;border-radius:0 0 14px 14px;padding:28px 14px 12px;font-size:13px;background:linear-gradient(transparent,rgba(0,0,0,.62))}
.gctl{display:flex;align-items:center;gap:18px;margin-top:20px}
.cnt{font-size:13px;color:var(--mut);min-width:56px;font-variant-numeric:tabular-nums}
.pg{flex:1;height:2px;background:var(--line);position:relative}
.pg i{position:absolute;top:0;bottom:0;left:0;width:20%;background:var(--ink)}
.nv{display:flex;gap:8px}
.nv button{width:46px;height:46px;border:1px solid var(--ink);background:none;border-radius:50%;cursor:pointer;font-size:18px;transition:.25s}
.nv button:hover{background:var(--ink);color:#fff}
.lb{position:fixed;inset:0;z-index:300;background:rgba(10,10,10,.95);display:flex;align-items:center;justify-content:center;animation:fi .25s}
@keyframes fi{from{opacity:0}}
.lb .st{max-width:92vw;display:flex;flex-direction:column;align-items:center;gap:12px}
.lb img{max-width:92vw;max-height:82vh;object-fit:contain;display:block}
.lb p{color:#ccc;font-size:14px;min-height:20px;text-align:center}
.lb button{position:absolute;background:rgba(255,255,255,.14);border:0;color:#fff;width:48px;height:48px;border-radius:50%;font-size:22px;cursor:pointer;line-height:1}
.lb button:hover{background:rgba(255,255,255,.28)}
.lb .x{top:16px;right:16px}.lb .p{left:12px;top:50%;margin-top:-24px}.lb .n{right:12px;top:50%;margin-top:-24px}
.lb .c{position:absolute;top:28px;left:22px;color:#bbb;font-size:13px}
/* ===== ADMIN ===== */
body.adm{background:#f6f6f4}body.adm::before{display:none}
.al{min-height:100svh;display:grid;place-items:center;padding:24px;background:var(--bg)}
.box{background:#fff;border:1px solid var(--line);padding:clamp(26px,5vw,44px);width:100%;max-width:430px}
.box h1{font-size:1.9rem;letter-spacing:-.045em;line-height:1.1;margin:0 0 8px;font-weight:800}
.box p.m{color:var(--mut);font-size:14px;margin-bottom:20px}
.alab{display:block;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
.in{width:100%;background:#fff;border:1px solid #cfcec9;padding:11px 12px;border-radius:0;font-size:14px}
.in:focus{border-color:var(--ink);outline:0}
textarea.in{min-height:90px;resize:vertical}
.ad{display:grid;grid-template-columns:240px 1fr;min-height:100svh}
.sb{background:var(--ink);color:#fff;padding:24px 16px;position:sticky;top:0;height:100svh;display:flex;flex-direction:column;gap:4px}
.sb b{font-size:15px}.sb small{color:#999;margin-bottom:20px;font-size:12px}
.sb button,.sb a{background:none;border:0;color:#bbb;text-align:left;padding:11px 12px;cursor:pointer;font-size:14px;display:block}
.sb button.on,.sb button:hover,.sb a:hover{background:#262626;color:#fff}
.sb .gap{flex:1}
.mn{padding:clamp(18px,3vw,40px);max-width:1100px;width:100%}
.mn h2{font-size:1.7rem;letter-spacing:-.04em;margin:0 0 6px;max-width:none;line-height:1.1}
.mn>p.m{color:var(--mut);margin-bottom:22px;font-size:14px}
details.g{background:#fff;border:1px solid var(--line);margin-bottom:10px}
details.g summary{padding:16px 18px;cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.g summary::after{content:"+";color:var(--mut)}details.g[open] summary::after{content:"–"}
details.g .bd{padding:0 18px 18px}
.it{border:1px solid var(--line);padding:14px;margin-top:14px;background:#fcfcfb}
.it .tb{display:flex;gap:8px;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut)}
.sm{background:#fff;border:1px solid #cfcec9;padding:6px 12px;cursor:pointer;font-size:12.5px;border-radius:0}
.sm:hover{background:var(--ink);color:#fff}
.sm.dg:hover{background:#b3261e;border-color:#b3261e}
.imf{display:flex;gap:14px;align-items:center;margin-top:14px;padding:10px;border:1px dashed #cfcec9;background:#fff}
.imf .pvw{width:92px;flex:none}.imf p{font-size:12.5px;color:var(--mut);margin-bottom:6px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-top:14px}
.gc{border:1px solid var(--line);padding:10px;background:#fff}
.gc .tb2{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.gc input,.gc select{margin-top:8px;padding:7px 8px;font-size:12.5px}
.bar{position:sticky;bottom:0;background:#f6f6f4;padding:14px 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);margin-top:20px;z-index:5}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.md{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;display:grid;place-items:center;padding:16px;overflow:auto}
.md>div{background:#fff;width:100%;max-width:860px;display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px;max-height:94vh;overflow:auto}
.md h3{grid-column:1/-1;font-size:1.25rem;letter-spacing:-.03em}
.md .pv{align-self:start;border:1px solid var(--line)}
.msg{font-size:13px;color:#a33;min-height:18px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;font-size:14px;z-index:200}
@media(max-width:800px){
 .ad{grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr;align-content:start}.mn{min-width:0}.sb{position:static;height:auto;align-self:start;flex-direction:row;flex-wrap:wrap;padding:12px}
 .sb b,.sb small,.sb .gap{display:none}.md>div{grid-template-columns:1fr}
}

/* --- social icons --- */
.soc a .top{display:flex;justify-content:space-between;align-items:flex-start}
.soc .ic{width:54px;height:54px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;transition:.3s var(--ease)}
.soc .ic svg{width:26px;height:26px}
.soc a:hover .ic{border-color:#555;transform:rotate(-8deg) scale(1.06)}
.soc .ar2{font-size:20px;transition:.3s var(--ease)}.soc a:hover .ar2{transform:translate(3px,-3px)}
.soc .nm{font-size:1.25rem;letter-spacing:-.03em;font-weight:600;display:block}
.soc .bt{display:flex;flex-direction:column;gap:2px;margin-top:22px}

async function addFiles(path,files){
 const arr=get(path);let n=0,bad=0;
 const prog=t=>{let d=$(".toast.up");if(!d){d=document.createElement("div");d.className="toast up";document.body.append(d)}d.textContent=t};
 for(let i=0;i<files.length;i++){const f=files[i];prog("Uploading "+(i+1)+" / "+files.length+"…");
  try{const src0=await prep(f),im=await loadImg(src0),ar=im.width/im.height,up=await Backend.upload(src0),img={src:up.src,path:up.path,alt:"",x:50,y:50,zoom:1,ar:ar},shape=ar>1.25?"wide":ar<.9?"tall":"square";
   const empty=arr.find(it=>!(it.img&&it.img.src));

  catch(e){bad++;toast(f.name+": "+fbMsg(e))}}

/* ===== ROUTER / BOOT ===== */
let mode=null;
const isAdmin=()=>location.hash.startsWith("#/admin");
function route(force,over){
 const m=over||(isAdmin()?"admin":"site");
 if(!force&&m===mode&&m==="admin")return;
 if(!force&&m===mode)return;
 mode=m;window.onbeforeunload=null;document.onkeydown=null;window.onscroll=null;document.body.style.overflow="";
 if(m==="admin"){delete document.documentElement.dataset.theme;applyTheme(null);adminView();window.scrollTo(0,0);return}
 document.body.className="";document.title=S.site.title;
 const md=$('meta[name="description"]');if(md)md.content=S.site.desc;
 {let t="light";try{t=localStorage.getItem("theme")||"light"}catch(e){}if(S.site.dark===false)t="light";if(themed(S.theme)){let sv=null;try{sv=localStorage.getItem("theme")}catch(e){}t=S.site.dark!==false&&(sv==="dark"||sv==="light")?sv:(lum(S.theme.bg)<.35?"dark":"light")}document.documentElement.dataset.theme=t;applyTheme(S.theme)}
 root.innerHTML=site();bindSite();seo();(window.requestIdleCallback?requestIdleCallback:f=>setTimeout(f,2500))(()=>{loadGA(S.site.ga);countVisit()},{timeout:4000});
 const t=decodeURIComponent(location.hash.slice(1));const el=t&&document.getElementById(t);if(el)el.scrollIntoView();else if(!/^\/post\//.test(t))window.scrollTo(0,0);openFromHash()}
function go(m){try{location.hash=m==="admin"?"#/admin":"#home"}catch(e){}route(true,m)}
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[href]");if(!a)return;const h=a.getAttribute("href");
 if(h==="#/admin"){e.preventDefault();go("admin")}
 else if(mode==="admin"&&h==="#home"&&!e.defaultPrevented){e.preventDefault();go("site")}});
window.addEventListener("hashchange",()=>{route();if(mode==="site")openFromHash()});
document.addEventListener("click",e=>{const t=e.target;if(!t.closest)return;
 const al=t.closest("[data-all]");if(al){e.preventDefault();openAll();return}
 const sh=t.closest("[data-share]");if(sh){e.preventDefault();doShare(sh.dataset.title,sh.dataset.url);return}
 const so=t.closest(".soc a[data-k]");if(so)track("k_"+so.dataset.k);
 const bp=t.closest("[data-post]");if(bp)openPost(bp.dataset.post)});
document.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const bp=e.target.closest&&e.target.closest("[data-post]");if(bp){e.preventDefault();openPost(bp.dataset.post)}}});
let shown=false,cached=null;
try{cached=JSON.parse(localStorage.getItem(CK)||"null")}catch(e){}
if(cached&&typeof cached==="object"&&!isAdmin()){S=merge(cached);route(true);shown=true}
else if(!isAdmin())setTimeout(()=>{if(!shown){shown=true;route(true)}},1200);
Backend.fast().then(d=>{const j=JSON.stringify(d);try{localStorage.setItem(CK,j)}catch(e){}
 const was=cached&&shown?JSON.stringify(cached):"";
 if(!shown||j!==was){const y=window.scrollY;S=merge(d);if(mode!=="admin"){const o=shown;shown=true;route(true);if(o)window.scrollTo(0,y)}}
 cached=d}).catch(()=>{if(!shown){shown=true;route(true)}});
})();
